# Packaging for the desktop shell (ADR-29). `npm run dist -w apps/desktop`
# builds for the current OS, unsigned. The `Desktop release` workflow builds
# the signed ones: it supplies the Mac certificate and Apple API key through
# the environment, and the Windows `azureSignOptions` on the command line, so
# no publisher name or account lives in this file (#4843,
# docs/ops/deployment/desktop-releases.md).
appId: live.frapp.desktop
productName: Frapp
copyright: Copyright © Frapp

directories:
  output: release

# Where an installed app looks for updates (src/main/updater.ts): the API's
# `GET /v1/desktop/updates/:file`, which redirects each feed and file to a
# time-limited link into the private releases bucket. Nothing here uploads:
# every build runs with `--publish never`, and scripts/ci/desktop-publish.mjs
# puts the files in the bucket. A plain version always writes the `latest`
# feeds; which channel reads them is decided at publish.
publish:
  - provider: generic
    url: https://api.frapp.live/v1/desktop/updates

# The compiled shell, bundled into one file by scripts/bundle.mjs.
# Nothing from node_modules: its one runtime library is compiled into the
# bundle, and without the exclusion electron-builder walks up to the monorepo
# root and packs the whole workspace's node_modules into the app.
files:
  - dist/**/*
  - package.json
  - "!**/node_modules/**/*"
npmRebuild: false
asar: true

# The tray icon, read from `process.resourcesPath` (src/main/index.ts).
# Brand rasters stay canonical in packages/brand-assets; nothing is copied
# into this app.
extraResources:
  - from: ../../packages/brand-assets/assets/signet-emblem-B-32.png
    to: tray.png

# The sign-in link back from the browser (#4841, src/shared/auth-link.ts).
# This writes it into the macOS and Linux bundles; Windows registers it at
# first launch (`setAsDefaultProtocolClient` in src/main/index.ts).
protocols:
  - name: Frapp sign-in
    schemes:
      - frapp-desktop

mac:
  icon: ../../packages/brand-assets/assets/signet-emblem-B-1024.png
  category: public.app-category.social-networking
  target:
    # The zip is what electron-updater downloads; the dmg is what people install.
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  hardenedRuntime: true
  # No `identity`: electron-builder signs with the certificate in CSC_LINK
  # when the release workflow provides one, and skips signing when there is
  # none (desktop-build.yml sets CSC_IDENTITY_AUTO_DISCOVERY=false).

dmg:
  title: Frapp

win:
  # The PNG, not the favicon .ico: electron-builder needs a 256px frame and
  # builds the .ico itself.
  icon: ../../packages/brand-assets/assets/signet-emblem-B-1024.png
  target:
    - target: nsis
      arch: [x64, arm64]

# One click, per user, no admin prompt: how Discord and Slack install.
nsis:
  oneClick: true
  perMachine: false
  artifactName: Frapp-Setup-${version}.${ext}

linux:
  executableName: frapp
  icon: ../../packages/brand-assets/assets/signet-emblem-B-1024.png
  category: Network
  target:
    - AppImage
