# Device pass: the tab bar's + (New, #5983) opens its panel and closes it
# (#3603). Tapped by id: open, the + shares its label with the scrim.
appId: live.frapp.mobile
name: "New (the +) opens and closes"
tags:
  - smoke
---
- launchApp
- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: "tab-plus"
- assertVisible: "Close New"
- takeScreenshot: quick-actions
- tapOn:
    id: "tab-plus"
- assertVisible:
    id: "tab-plus"
    text: "New"
- assertNotVisible: "Close New"
