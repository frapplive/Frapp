name: Desktop release

# Builds, signs and publishes the desktop app (apps/desktop, ADR-29), and moves
# its update channels (#4843). Run by hand; the runbook is
# docs/ops/deployment/desktop-releases.md.
#
#   release  builds the version in apps/desktop/package.json on macOS and
#            Windows, signs both, notarizes the Mac app, and after Paul
#            approves the `production` gate uploads the files and points the
#            BETA channel at them. Nothing an ordinary install reads moves.
#   point    points a channel at a version already published: the promotion
#            to everyone (same files, nothing rebuilt), a staged one, or
#            pulling a release back to the one before.
#
# Three kinds of job, on purpose:
#   - `build` installs the lockfile and compiles, with no secret in reach.
#   - `sign` holds the Apple and Azure signing secrets, which live in the
#     `automation` environment (main only, no reviewers, so signing needs no
#     click). It installs only electron-builder, from its own lockfile
#     (tools/desktop-release), with no install scripts.
#   - `publish` and `point` run in `production`, for its reviewer gate and
#     because Google accepts this repository's sign-in only from a job in it
#     (scripts/gcp/bootstrap.sh). The signing secrets never reach them.
#
# Unsigned packaging on every PR stays in desktop-build.yml.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "release: build, sign and publish to beta. point: move a channel to a published version."
        type: choice
        options: [release, point]
        default: release
      channel:
        description: "point only: the channel to move (latest is everyone)"
        type: choice
        options: [latest, beta]
        default: latest
      version:
        description: "point only: a published version, like 0.2.0"
        type: string
        default: ""
      staging:
        description: "point only: offer it to this percent of installs first (blank or 100 is everyone)"
        type: string
        default: ""

# One at a time: two runs moving the same feeds would race.
concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The bucket scripts/gcp/desktop-downloads.sh makes (DESKTOP_RELEASES_BUCKET in scripts/gcp/lib.sh).
  DESKTOP_BUCKET: frapp-live-downloads
  # Where a released app asks for updates: the API route in front of that
  # bucket. Only this workflow gives a build the address (electron-builder.yml
  # sets `publish: null`), so only a signed build ever updates itself.
  DESKTOP_UPDATE_URL: https://api.frapp.live/v1/desktop/updates

jobs:
  # Compiles the shell with the full install, and holds no secret: `npm ci`
  # runs other people's install scripts, so it never shares a job with a
  # certificate. The compiled output is the same on every OS.
  build:
    name: compile the shell
    if: inputs.action == 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and install dependencies
        uses: ./.github/actions/node-setup
        with:
          install: ci

      - name: Build the shell
        run: npm run build -w apps/desktop

      - name: Upload the compiled shell
        uses: actions/upload-artifact@v7
        with:
          name: desktop-dist
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 7

  # Packages and signs without the workspace install: the app ships no
  # node_modules (electron-builder.yml), so packaging needs only the compiled
  # shell and electron-builder itself.
  sign:
    name: package and sign (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    environment:
      name: automation
      deployment: false
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Before anything is installed, and by name only: a missing secret must
      # stop the run here, because electron-builder skips signing and
      # notarizing quietly when it finds no credentials.
      - name: Check the signing secrets are set (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          HAS_CERT: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 != '' }}
          HAS_CERT_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD != '' }}
          HAS_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          HAS_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
        run: |
          missing=()
          [ "$HAS_CERT" = "true" ] || missing+=(MAC_CERTIFICATE_P12_BASE64)
          [ "$HAS_CERT_PASSWORD" = "true" ] || missing+=(MAC_CERTIFICATE_PASSWORD)
          [ "$HAS_API_KEY" = "true" ] || missing+=(APPLE_API_KEY_P8)
          [ "$HAS_API_KEY_ID" = "true" ] || missing+=(APPLE_API_KEY_ID)
          [ "$HAS_API_ISSUER" = "true" ] || missing+=(APPLE_API_ISSUER)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::The automation environment lacks: ${missing[*]} (docs/ops/deployment/desktop-releases.md, 2. Signing secrets)."
            exit 1
          fi

      - name: Check the signing secrets are set (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          HAS_TENANT: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_CLIENT: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER_NAME != '' }}
          HAS_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}
          HAS_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT != '' }}
          HAS_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE != '' }}
        run: |
          missing=()
          [ "$HAS_TENANT" = "true" ] || missing+=(AZURE_TENANT_ID)
          [ "$HAS_CLIENT" = "true" ] || missing+=(AZURE_CLIENT_ID)
          [ "$HAS_CLIENT_SECRET" = "true" ] || missing+=(AZURE_CLIENT_SECRET)
          [ "$HAS_PUBLISHER" = "true" ] || missing+=(AZURE_SIGNING_PUBLISHER_NAME)
          [ "$HAS_ENDPOINT" = "true" ] || missing+=(AZURE_SIGNING_ENDPOINT)
          [ "$HAS_ACCOUNT" = "true" ] || missing+=(AZURE_SIGNING_ACCOUNT)
          [ "$HAS_PROFILE" = "true" ] || missing+=(AZURE_SIGNING_PROFILE)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::The automation environment lacks: ${missing[*]} (docs/ops/deployment/desktop-releases.md, 2. Signing secrets)."
            exit 1
          fi

      - name: Setup Node
        uses: ./.github/actions/node-setup
        with:
          install: none

      - name: Fetch the compiled shell
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name desktop-dist --dir apps/desktop/dist

      # electron-builder and its whole dependency tree, at the versions and
      # checksums tools/desktop-release/package-lock.json pins, with no
      # install scripts run. `npx electron-builder@x` would pin one package and
      # resolve the other two hundred fresh, in the job that holds the
      # certificates. No secret is in this step's environment.
      - name: Install the pinned packaging tools
        shell: bash
        working-directory: tools/desktop-release
        run: npm ci --ignore-scripts --no-audit --no-fund

      # With no node_modules to read it from, electron-builder is told which
      # Electron to package: the exact version apps/desktop/package.json pins.
      - name: Read the Electron version
        id: electron
        shell: bash
        run: echo "version=$(node -p "require('./apps/desktop/package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"

      # The certificate signs the app, and the API key's presence is what
      # makes electron-builder notarize it with Apple (APPLE_API_KEY is a path
      # to the key file, which the step writes and removes).
      - name: Package, sign and notarize (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ELECTRON_VERSION: ${{ steps.electron.outputs.version }}
        run: |
          key="$RUNNER_TEMP/apple-api-key.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          APPLE_API_KEY="$key" node ../../tools/desktop-release/node_modules/electron-builder/cli.js \
            --mac --publish never \
            "-c.electronVersion=$ELECTRON_VERSION" \
            -c.publish.provider=generic "-c.publish.url=$DESKTOP_UPDATE_URL"

      # Gatekeeper's own verdict, so a build that was quietly left unsigned
      # or un-notarized fails here and not on a member's Mac.
      - name: Verify the signature and notarization (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: apps/desktop
        run: |
          app="$(find release -maxdepth 2 -name 'Frapp.app' -print -quit)"
          test -n "$app"
          # The update address, without which this build would never update.
          grep -q "^url: $DESKTOP_UPDATE_URL\$" "$app/Contents/Resources/app-update.yml"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

      # Azure Artifact Signing, through electron-builder's azureSignOptions.
      # The publisher name is also written into the app, which is how an
      # installed copy checks an update came from the same publisher.
      - name: Package and sign (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: apps/desktop
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          PUBLISHER_NAME: ${{ secrets.AZURE_SIGNING_PUBLISHER_NAME }}
          SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          ELECTRON_VERSION: ${{ steps.electron.outputs.version }}
        run: |
          node ../../tools/desktop-release/node_modules/electron-builder/cli.js \
            --win --publish never \
            "-c.electronVersion=$ELECTRON_VERSION" \
            -c.publish.provider=generic "-c.publish.url=$DESKTOP_UPDATE_URL" \
            "-c.win.azureSignOptions.publisherName=$PUBLISHER_NAME" \
            "-c.win.azureSignOptions.endpoint=$SIGNING_ENDPOINT" \
            "-c.win.azureSignOptions.codeSigningAccountName=$SIGNING_ACCOUNT" \
            "-c.win.azureSignOptions.certificateProfileName=$SIGNING_PROFILE"

      # An installed copy takes an update only when the update's signer is
      # the publisher name written into it, compared exactly. A name that is
      # one character off signs fine and then strands every install, so the
      # two are compared here, before anything is published.
      - name: Verify the signature and the publisher name (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/desktop
        env:
          PUBLISHER_NAME: ${{ secrets.AZURE_SIGNING_PUBLISHER_NAME }}
        run: |
          $installers = Get-ChildItem release -Filter 'Frapp-Setup-*.exe'
          if ($installers.Count -eq 0) { throw 'No installer was built.' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') { throw "$($installer.Name) is not validly signed: $($signature.Status)" }
            $signer = $signature.SignerCertificate.GetNameInfo('SimpleName', $false)
            if ($signer -cne $env:PUBLISHER_NAME) {
              throw "$($installer.Name) is signed by a certificate whose name is not AZURE_SIGNING_PUBLISHER_NAME. Set the secret to the certificate's subject name exactly."
            }
            Write-Host "$($installer.Name): signed, and the signer is the publisher name."
          }
          $configs = Get-ChildItem release -Recurse -Filter 'app-update.yml'
          if ($configs.Count -eq 0) { throw 'The build carries no update address (app-update.yml).' }
          foreach ($config in $configs) {
            $text = Get-Content $config.FullName -Raw
            if ($text -notmatch "(?m)^url: $([regex]::Escape($env:DESKTOP_UPDATE_URL))\s*$") { throw "$($config.FullName) names another update address." }
            if ($text -notmatch '(?m)^publisherName:') { throw "$($config.FullName) names no publisher, so installs would skip the publisher check." }
          }

      - name: Upload the signed files
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish to the beta channel
    needs: sign
    runs-on: ubuntu-latest
    # Paul's approval, and the only place Google takes this repository's sign-in.
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the provider ids
        id: ids
        env:
          TARGET_ENVIRONMENT: production
        run: node scripts/ci/provider-ids.mjs

      - name: Fetch the signed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-release"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'desktop-release-*' --dir "$RUNNER_TEMP/artifacts"
          find "$RUNNER_TEMP/artifacts" -type f -exec mv {} "$RUNNER_TEMP/desktop-release/" \;
          ls -l "$RUNNER_TEMP/desktop-release"

      - name: Upload and point the beta channel at it
        env:
          DESKTOP_RELEASE_DIR: ${{ runner.temp }}/desktop-release
          CLOUD_RUN_PROVIDER: ${{ steps.ids.outputs.cloud_run_provider }}
          CLOUD_RUN_DEPLOYER: ${{ steps.ids.outputs.cloud_run_deployer }}
        run: node scripts/ci/desktop-publish.mjs release

  point:
    name: point ${{ inputs.channel }} at ${{ inputs.version }}
    if: inputs.action == 'point' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the provider ids
        id: ids
        env:
          TARGET_ENVIRONMENT: production
        run: node scripts/ci/provider-ids.mjs

      - name: Move the channel
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          STAGING: ${{ inputs.staging }}
          CLOUD_RUN_PROVIDER: ${{ steps.ids.outputs.cloud_run_provider }}
          CLOUD_RUN_DEPLOYER: ${{ steps.ids.outputs.cloud_run_deployer }}
        run: node scripts/ci/desktop-publish.mjs point --channel "$CHANNEL" --version "$VERSION" --staging "$STAGING"
