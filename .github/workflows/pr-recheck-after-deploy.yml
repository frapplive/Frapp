name: PR recheck after deploy

# The base-sync bot's second half (Paul, 2026-11-24): when a deploy recovers from
# a failure, re-run the failed jobs of each open PR's Migration drift gate run
# that went red while it was stuck (a migration-order race, #4795, #5958), so the
# gate turns green without waiting for the PR's next push. Behaviour:
# docs/ci-cd/pr-babysitting.md § Recheck after a deploy; the rule for which runs
# it touches: scripts/ci/pr-recheck-after-deploy.mjs.
#
# ── Why only the Migration drift gate ───────────────────────────────────────
# A re-run keeps its run's commit, which for a pull request is the test merge
# with `main` as it stood when the run started, so re-running CI can't pick up a
# fix that landed on `main` since. The gate's jobs read the published migration
# snapshot (staging's and production's applied state) when they run, and
# `migration-drift` also reads live `origin/main`, so a re-run sees the new
# database state. Paul chose this scope over also merging `main` into red PRs.
#
# ── Why it fires on Migration snapshot, not on the deploys ──────────────────
# The gate reads the databases through the snapshot, which
# `migration-snapshot.yml` publishes after each Deploy staging and Deploy
# production run. Fired by the deploy itself, a re-run would read the snapshot
# from before it. Only a snapshot run a deploy started (`event ==
# 'workflow_run'`) fires a sweep; the script decides per run whether a deploy
# that was failing when it ran has succeeded since.
#
# ── Why its own workflow and not a job in pr-base-sync.yml ──────────────────
# It needs `actions: write`, which base sync doesn't hold, and none of base
# sync's App token or `automation` environment: a re-run by GITHUB_TOKEN starts
# the jobs like any re-run. It also has its own trigger, and base sync's
# concurrency groups are keyed by event, so a fourth trigger there would share
# or cancel their groups.
#
# This runs the default branch's copy of this file and the script (workflow_run
# semantics), so a change takes effect only after it merges. No secrets beyond
# GITHUB_TOKEN, no npm ci: the script is dependency-free.

on:
  workflow_run:
    workflows: ["Migration snapshot"]
    types: [completed]
    branches: [main]

permissions:
  actions: write # list runs and re-run failed jobs
  pull-requests: read # list open PRs
  contents: read

# The newest publish supersedes an older one: a sweep reads every open PR afresh
# and writes nothing a cancelled one would have needed. But concurrency is
# evaluated before the job `if:`, so a completion the job will skip (a scheduled
# or dispatched publish, a failed one) must not share the group: it would cancel
# a running sweep and then do nothing itself, the trap pr-base-sync.yml
# documents. Those get a group of their own run, which cancels nothing.
concurrency:
  group: ${{ (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run') && 'pr-recheck-after-deploy' || format('pr-recheck-after-deploy-skip-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  recheck:
    # A deploy-driven publish that succeeded, in this repository. The scheduled
    # and hand-dispatched publishes are not "after a deploy".
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Re-run gate runs that went red while a deploy was stuck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_RUN_ID: ${{ github.event.workflow_run.id }}
          SNAPSHOT_RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: node scripts/ci/pr-recheck-after-deploy.mjs
